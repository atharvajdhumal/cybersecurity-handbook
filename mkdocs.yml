site_name: CYBERDEFENSE // GLOBAL INTEL HUB
site_description: Enterprise cybersecurity reference architecture, open-source defensive tooling, and autonomous daily threat intelligence.
site_url: https://atharvajdhumal.github.io/cybersecurity-handbook/

theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Daily Threat Feed: news/index.md
  - Core Domains:
      - Network Security: domains/network-security.md
      - Cloud Security: domains/cloud-security.md
      - Endpoint Security: domains/endpoint-security.md
      - Application Security: domains/application-security.md
      - IAM: domains/iam.md
      - Information & Data: domains/data-security.md
      - OT & Critical Infrastructure: domains/ot-infrastructure.md
      - AI Security: domains/ai-security.md
  - Open-Source Arsenal: tools/open-source-arsenal.md
  - Certifications: certifications/2026-roadmap.md

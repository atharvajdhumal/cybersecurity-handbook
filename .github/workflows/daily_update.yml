name: Daily Security Intelligence Auto-Update

on:
  schedule:
    # Runs every morning at 06:17 UTC
    - cron: '17 6 * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "scripts/requirements.txt" ]; then
            pip install -r scripts/requirements.txt
          else
            pip install feedparser google-genai requests
          fi

      - name: Fetch Threat Feeds & Update /public/data/daily-threats.json via Gemini 3.8 Flash
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/daily_updater.py

      - name: Commit and Push Updated Daily Threat JSON
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(intel): auto-update daily-threats.json [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies & Build Production Bundle
        run: |
          npm install
          npm run build

      - name: Deploy Production Bundle to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

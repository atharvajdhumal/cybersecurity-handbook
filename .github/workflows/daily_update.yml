name: Daily Security Intelligence Auto-Update

on:
  schedule:
    # Runs everyday at 06:17 UTC
    - cron: '17 6 * * *'
  workflow_dispatch: # Keeps the manual "Run workflow" trigger button active

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; elif [ -f "scripts/requirements.txt" ]; then pip install -r scripts/requirements.txt; else pip install feedparser google-genai requests mkdocs-material; fi

      - name: Fetch Feeds and Synthesize Updates via Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/daily_updater.py

      - name: Commit and Push Updated Markdown
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update threat feed: $(date +'%Y-%m-%d')" && git push)

      - name: Deploy MkDocs to GitHub Pages
        run: |
          mkdocs gh-deploy --force
